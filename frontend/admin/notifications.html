<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | IHEC Ride</title>
    <link rel="icon" href="../assets/images/logo.jpeg">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-theme">

<div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <h1>Centre de notifications</h1>
            <button class="btn btn-outline" onclick="toutLire()">Tout marquer comme lu</button>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card red"><div class="kpi-value" id="kSos">0</div><div class="kpi-label">Alertes SOS actives</div></div>
            <div class="kpi-card yellow"><div class="kpi-value" id="kRec">0</div><div class="kpi-label">Réclamations ouvertes</div></div>
            <div class="kpi-card"><div class="kpi-value" id="kInscrits">0</div><div class="kpi-label">Nouveaux inscrits</div></div>
            <div class="kpi-card green"><div class="kpi-value" id="kActions">0</div><div class="kpi-label">Actions aujourd'hui</div></div>
        </div>

        <div class="flex gap-16 mb-24">
            <button class="btn btn-primary btn-sm" onclick="filtrer('all')">Toutes</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('sos')">SOS</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('user')">Utilisateurs</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('trajet')">Trajets</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('reclamation')">Réclamations</button>
        </div>

        <div class="notification-list" id="notifList"></div>
    </main>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/common.js"></script>
<script>
Auth.requireRole('ADMIN');
renderSidebar('sidebar', 'ADMIN', 'notifications.html');

const notifs = [];
let filter = 'all';

function render() {
    const list = notifs.filter(n => filter === 'all' || n.categorie === filter);
    const el = document.getElementById('notifList');
    if (list.length === 0) {
        el.innerHTML = '<p class="text-muted text-center" style="padding:40px;">Aucune notification.</p>';
        return;
    }
    el.innerHTML = list.map(n => `
        <div class="notification-item ${n.lu ? '' : 'unread'}">
            <div class="notif-content">
                <div class="notif-title">${n.titre}</div>
                <div class="notif-text">${n.contenu}</div>
            </div>
            <div class="notif-time">${formatDate(n.date)}</div>
        </div>
    `).join('');
}
function filtrer(f) { filter = f; render(); }
function toutLire() { notifs.forEach(n => n.lu = true); render(); }
render();
</script>

</body>
</html>
