<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajets | IHEC Ride</title>
    <link rel="icon" href="../assets/images/logo.jpeg">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-theme">

<div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="topbar">
            <h1>Supervision des trajets</h1>
            <a href="notifications.html" class="notification-bell"><span class="bell-icon">•</span><span class="dot"></span></a>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-value" id="tot">0</div><div class="kpi-label">Trajets totaux</div></div>
            <div class="kpi-card green"><div class="kpi-value" id="ouv">0</div><div class="kpi-label">Ouverts / En cours</div></div>
            <div class="kpi-card yellow"><div class="kpi-value" id="term">0</div><div class="kpi-label">Terminés</div></div>
            <div class="kpi-card red"><div class="kpi-value" id="ann">0</div><div class="kpi-label">Annulés</div></div>
        </div>

        <div class="flex gap-16 mb-24">
            <button class="btn btn-primary btn-sm" onclick="filtrer('all')">Tous</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('OUVERT')">Ouverts</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('EN_COURS')">En cours</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('TERMINE')">Terminés</button>
            <button class="btn btn-outline btn-sm" onclick="filtrer('ANNULE')">Annulés</button>
        </div>

        <div class="admin-card">
            <h3>Liste des trajets</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Conducteur</th>
                        <th>Itinéraire</th>
                        <th>Date/Heure</th>
                        <th>Prix</th>
                        <th>Places</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tb"></tbody>
            </table>
        </div>

        <div class="admin-card mt-24">
            <h3>Carte des trajets en temps réel</h3>
            <div style="height:400px; border-radius:12px; background:linear-gradient(135deg, #EFF6FF, #DBEAFE); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;">
                <img src="../assets/images/campus.jpeg" style="width:100%; height:100%; object-fit:cover; opacity:.6;" alt="Carte">
                <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(26,86,219,.4); color:white;">
                    <h3 style="color:white; margin:0;">Carte interactive Leaflet.js</h3>
                    <p style="margin-top:8px;">Positions GPS en temps réel · mise à jour toutes les 5 secondes.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/common.js"></script>
<script>
Auth.requireRole('ADMIN');
renderSidebar('sidebar', 'ADMIN', 'trajets.html');

let filter = 'all';

function render() {
    const list = (MOCK.trajets || []).filter(t => filter === 'all' || t.statut === filter);

    document.getElementById('tot').textContent = (MOCK.trajets || []).length;
    document.getElementById('ouv').textContent = (MOCK.trajets || []).filter(t => t.statut === 'OUVERT' || t.statut === 'EN_COURS').length;
    document.getElementById('term').textContent = (MOCK.trajets || []).filter(t => t.statut === 'TERMINE').length;
    document.getElementById('ann').textContent = (MOCK.trajets || []).filter(t => t.statut === 'ANNULE').length;

    document.getElementById('tb').innerHTML = list.map(t => `
        <tr>
            <td>#${t.id}</td>
            <td><strong>${t.conducteurNom}</strong></td>
            <td>${t.depart} → ${t.destination}</td>
            <td>${formatDate(t.dateHeure)}</td>
            <td>${t.prix} DT</td>
            <td>${t.placesDispo}/${t.placesTotal}</td>
            <td><span class="status-tag status-${t.statut}">${t.statut}</span></td>
            <td>
                <button class="btn btn-sm btn-outline" onclick="voir(${t.id})">Voir</button>
                <button class="btn btn-sm btn-danger" onclick="annuler(${t.id})">Annuler</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="text-center text-muted" style="padding:30px;">Aucun trajet.</td></tr>';
}

function filtrer(s) { filter = s; render(); }

function voir(id) {
    const t = MOCK.trajets.find(x => x.id === id);
    if (!t) return;
    alert(`Trajet #${t.id}\n\nConducteur : ${t.conducteurNom}\n${t.depart} → ${t.destination}\nDate : ${t.dateHeure}\nPrix : ${t.prix} DT\nPlaces : ${t.placesDispo}/${t.placesTotal}\nStatut : ${t.statut}`);
}

function annuler(id) {
    if (!confirm('Annuler ce trajet ?')) return;
    const t = MOCK.trajets.find(x => x.id === id);
    if (t) t.statut = 'ANNULE';
    render();
}

render();
</script>

</body>
</html>
